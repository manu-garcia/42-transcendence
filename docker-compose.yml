version: '3'

services:
  nginx:
    build: ./nginx
    container_name: nginx
    depends_on:
      - frontend
    ports:
      - "443:443"
    networks:
      - frontend
    restart: always

  frontend:
    build: ./frontend
    container_name: frontend
    networks:
      - frontend
    restart: always

networks:
  frontend:
    driver: bridge
