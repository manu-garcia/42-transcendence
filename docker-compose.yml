version: '3'

services:
  nginx:
    build: ./nginx
    container_name: nginx
    depends_on:
      - frontend
    ports:
      - "443:443"
    networks:
      - frontend
    restart: always

  frontend:
    build: ./frontend
    container_name: frontend
    networks:
      - frontend
    restart: always
  
  backend:
    build: ./backend
    container_name: backend
    networks:
      - frontend
      - backend
    restart: always

  db:
    build: ./db
    container_name: db
    env_file:
      - ./env/.env
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    networks:
      - backend
    restart: always

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  postgres-data: