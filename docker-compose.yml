version: "3"

services:
  nginx:
    build: ./nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "443:443"
    networks:
      - frontend
      - backend
    restart: always

  frontend:
    build:
      context: ./frontend/
      dockerfile: ./Dockerfile
    depends_on:
      - backend
    networks:
      - backend
    restart: always

  backend:
    build:
      context: ./backend/
      dockerfile: ./Dockerfile
      args:
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      - db
      - redis
    networks:
      - backend
    restart: always

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data/
    networks:
      - backend
    restart: always

  db:
    build:
      context: ./db
      dockerfile: ./Dockerfile
      args:
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    networks:
      - backend
    restart: always

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
