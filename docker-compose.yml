version: '3'

services:
  nginx:
    build: ./nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "443:443"
    networks:
      - frontend
    restart: always

  frontend:
    build:
      context: ./frontend/
      dockerfile: ./Dockerfile
    depends_on:
      - backend
    networks:
      - frontend
    restart: always
  
  backend:
    build:
      context: ./backend/
      dockerfile: ./Dockerfile
      args:
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      - db
    networks:
      - frontend
      - backend
    restart: always

  db:
    build: 
      context: ./db
      dockerfile: ./Dockerfile
      args:
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    networks:
      - backend
    restart: always

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  postgres-data: