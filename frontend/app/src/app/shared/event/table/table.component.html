<p-panel [header]="'shared.event.list' | translate">
  <ng-template pTemplate="icons">
    <p-button [label]="'shared.event.list.create' | translate" icon="pi pi-plus" (onClick)="createEvent()"></p-button>
  </ng-template>
  <p-table [value]="events$ | async">
    <ng-template pTemplate="header">
      <tr>
        <th>{{ "shared.event.list.name" | translate }}</th>
        <th>{{ "shared.event.list.actions" | translate }}</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-event>
      <tr>
        <td>{{ event.name }}</td>
        <td>
          <p-button
            [label]="'shared.event.list.actions.edit' | translate"
            icon="pi pi-pencil"
            (onClick)="editEvent(event)"
          ></p-button>
          <p-button
            class="m-2"
            [label]="'shared.event.list.actions.detail' | translate"
            icon="pi pi-play"
            (onClick)="goToEventDetail(event)"
          ></p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-panel>
