<p-panel [header]="'shared.event.list' | translate">
  <ng-template pTemplate="icons">
    <button type="button" class="btn btn-primary" (click)="createEvent()">
      {{ "shared.event.list.create" | translate }}
    </button>
  </ng-template>
  <p-table [value]="events$ | async">
    <ng-template pTemplate="header">
      <tr>
        <th>{{ "shared.event.list.name" | translate }}</th>
        <th>{{ "shared.event.list.actions" | translate }}</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-event>
      <tr>
        <td>{{ event.name }}</td>
        <td>
          <button type="button" class="btn btn-primary m-2" (click)="goToEventDetail(event)">
            {{ "shared.event.list.actions.detail" | translate }}
          </button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-panel>
