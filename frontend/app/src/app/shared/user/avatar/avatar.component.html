<div class="dropdown">
  <div id="dropdownMenuLink" role="button" class="d-flex justify-content-center flex-column" data-bs-toggle="dropdown">
    <p-avatar [image]="defaultAvatar" styleClass="mr-2" size="xlarge" shape="circle" />
    <div class="m-auto">{{ user?.username }}</div>
  </div>

  <ul class="dropdown-menu p-2" aria-labelledby="dropdownMenuLink">
    <a class="dropdown-item active" role="button" (click)="signout()">{{ "shared.user.signin.signout" | translate }}</a>
  </ul>
</div>
