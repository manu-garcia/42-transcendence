<ng-container *ngIf="form">
  <form [formGroup]="form">
    <div class="form-group">
      <label for="username">{{ "shared.user.signin.username" | translate }}</label>
      <input type="text" id="username" formControlName="username" class="form-control" />
    </div>
    <div class="form-group">
      <label for="password">{{ "shared.user.signin.password" | translate }}</label>
      <input type="password" id="password" formControlName="password" class="form-control" />
    </div>
    <div class="form-group">
      <label for="password2">{{ "shared.user.signin.password_repeat" | translate }}</label>
      <input type="password" id="password2" formControlName="password2" class="form-control" />
      <div class="field-message" *ngIf="form.get('password2')?.errors?.passwordMatch">
        {{ "shared.user.signin.error_match" | translate }}
      </div>
    </div>
  </form>

  <div class="d-flex justify-content-end mt-3">
    <button type="button" class="btn btn-primary" [disabled]="!form.valid || loading" (click)="signup()">
      {{ "shared.user.signin.signup" | translate }}
    </button>
  </div>
</ng-container>
