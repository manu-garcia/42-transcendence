<div class="flex justify-content-center">
  <form [formGroup]="form">
    <p-toast></p-toast>

    <div class="form-group">
      <label for="firstName">{{ "shared.user.form.firstName" | translate }}:</label>
      <input type="firstName" id="firstName" formControlName="firstName" class="form-control" />
    </div>

    <div class="form-group mt-2">
      <label for="profilePic" class="d-block">{{ "shared.user.form.choose_avatar" | translate }}:</label>
      <div class="d-block p-4">
        <input type="file" id="profilePic" (change)="onFileChange($event)" />
      </div>
    </div>

    <div class="d-flex justify-content-end mt-3 p-2">
      <button type="button" class="btn btn-primary" (click)="save()" [disabled]="!form.valid || form.pristine">
        {{ "general.save" | translate }}
      </button>
    </div>
  </form>
</div>
