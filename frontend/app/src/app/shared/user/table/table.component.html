<div class="card">
  <div class="card-header">{{ title ? title : ("shared.user.list" | translate) }}</div>
  <div class="card-body">
    <table class="table table-striped table-bordered table-responsive">
      <thead>
        <tr>
          <th>{{ "shared.user.list.name" | translate }}</th>
          <th *ngIf="showOnlineColumn">{{ "shared.user.list.online" | translate }}</th>
          <th>{{ "shared.user.list.actions" | translate }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.username }}</td>
          <td *ngIf="showOnlineColumn">
            <span class="{{ user | userStatusColor }}">{{ user | userStatus }}</span>
          </td>
          <td></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
