<p-panel [header]="'general.user.list' | translate">
  <p-table [value]="users">
    <ng-template pTemplate="header">
      <tr>
        <th>{{ "general.user.list.name" | translate }}</th>
        <th>{{ "general.user.list.actions" | translate }}</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-user>
      <tr>
        <td>{{ user.username }}</td>
        <td></td>
      </tr>
    </ng-template>
  </p-table>
</p-panel>
