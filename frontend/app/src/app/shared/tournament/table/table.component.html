<p-panel header="Tournament List">
  <p-table [value]="tournaments">
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-tournament>
      <tr>
        <td>{{ tournament.name }}</td>
        <td></td>
      </tr>
    </ng-template>
  </p-table>
</p-panel>
