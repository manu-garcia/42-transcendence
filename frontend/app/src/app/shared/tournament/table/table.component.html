<p-panel header="Tournament List">
  <ng-template pTemplate="icons">
    <p-button label="Create Tournament" icon="pi pi-plus" (onClick)="createTournament()"></p-button>
  </ng-template>
  <p-table [value]="tournaments$ | async">
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-tournament>
      <tr>
        <td>{{ tournament.name }}</td>
        <td>
          <p-button label="Edit" icon="pi pi-pencil" (onClick)="editTournament(tournament)"></p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-panel>
