<!-- Elements of the game -->
<div class="scenario-container">
  <div class="scenario">
    <div *ngIf="isPaused" class="pause-screen">
      <div class="pause-message">Game is paused, press 'ESC' to continue!</div>
    </div>
    <div class="Scoreboard scoreboard1">0</div>
    <div class="Scoreboard scoreboard2">0</div>

    <div class="paddle paddle1"></div>
    <div class="paddle paddle2"></div>

    <div *ngIf="fourPlayer" class="paddle paddle3"></div>
    <div *ngIf="fourPlayer" class="paddle paddle4"></div>

    <div class="net"></div>
    <div class="ball"></div>
  </div>
</div>

<!-- Contenedor para la información de los jugadores -->
<div class="player-info">
  <div class="player-info-group1"></div>
  <div class="player-info-group2"></div>
</div>

<!-- Botón para mostrar/ocultar opciones -->
<button (click)="toggleOptions()">Opciones</button>

<!-- Componente de opciones, visible según la propiedad showOptions -->
<app-game-options *ngIf="showOptions"></app-game-options>
