<div class="options-container">
  <h2>{{ "shared.game.game.options.power_ups" | translate }}</h2>
  <div class="option-group">
    <label for="velocity-boost">
      <input type="checkbox" id="velocity-boost" [checked]="velocityBoost" (change)="onVelocityBoostChange($event)" />
      {{ "shared.game.game.options.velocity_boost" | translate }}
    </label>
  </div>
  <div class="option-group">
    <label for="freeze">
      <input type="checkbox" id="freeze" [checked]="freeze" (change)="onFreezeChange($event)" />
      {{ "shared.game.game.options.freeze" | translate }}
    </label>
  </div>

  <div class="option-group">
    <h2>{{ "shared.game.game.options.appearance" | translate }}</h2>
    <label for="appearance"></label>
    <select id="appearance" [value]="appearance" (change)="onAppearanceChange($event)">
      <option value="default">{{ "shared.game.game.options.default" | translate }}</option>
      <option value="neon">{{ "shared.game.game.options.neon" | translate }}</option>
      <option value="tecno">{{ "shared.game.game.options.techno" | translate }}</option>
      <option value="loco">{{ "shared.game.game.options.crazy" | translate }}</option>
      <option value="florido">{{ "shared.game.game.options.flowery" | translate }}</option>
    </select>
  </div>
</div>
