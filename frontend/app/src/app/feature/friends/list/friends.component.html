<ng-container *ngIf="user$ | async as user">
  <div class="d-flex justify-content-end">
    <button type="button" class="btn btn-primary" (click)="addFriends(user)">
      {{ "general.friends.add" | translate }}
    </button>
  </div>

  <app-user-table
    class="m-5"
    [users]="user.friends"
    [title]="'general.friends' | translate"
    [showOnlineColumn]="true"
  ></app-user-table>
</ng-container>
