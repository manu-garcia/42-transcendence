<div class="card">
  <div class="card-header">Lista de partidos</div>
  <div class="card-body">
    <div class="d-flex justify-content-end">
      <button type="button" class="btn btn-primary">Siguiente partido</button>
      <!-- <button type="button" class="btn btn-primary" (click)="goToEventGame(event)">Siguiente partido</button> -->
    </div>

    <table class="table table-striped table-bordered table-responsive mt-2">
      <thead>
        <tr>
          <th>Primer grupo</th>
          <th>Segundo grupo</th>
          <th>Estado</th>
          <th>Ganadores</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let match of matches$ | async">
          <td>
            <ng-container *ngFor="let user of match.group1.users">
              <div>{{ user.alias }}</div>
            </ng-container>
          </td>
          <td>
            <ng-container *ngFor="let user of match.group2.users">
              <div>{{ user.alias }}</div>
            </ng-container>
          </td>
          <td>
            <ng-container *ngIf="match.played === false"> Pendiente </ng-container>
            <ng-container *ngIf="match.played === true"> Finalizado </ng-container>
          </td>
          <td>
            <ng-container *ngIf="match.winnerEventMatchGroup.maxUsers == null"> Sin ganador </ng-container>
            <ng-container *ngIf="match.winnerEventMatchGroup.maxUsers != null">
              {{ match.winnerEventMatchGroup.users[0].alias }}
            </ng-container>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
