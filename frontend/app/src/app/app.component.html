<div class="card">
  <p-toast key="errorHandler"></p-toast>

  <nav class="navbar navbar-expand-lg navbar-dark">
    <p-tabMenu
      class="mt-3"
      [model]="items"
      [activeItem]="activeItem"
      (activeItemChange)="onActiveItemChange($event)"
    ></p-tabMenu>

    <!-- Pedazo separador chaval -->
    <div class="flex-grow-1"></div>

    <span class="text-primary">{{ "general.language" | translate }}:</span>

    <div class="form-group m-3">
      <select class="form-control text-primary" (change)="changeLanguage($event.target.value)">
        <option [value]="'en'" [selected]="currentLanguage === 'en'">EN</option>
        <option [value]="'es'" [selected]="currentLanguage === 'es'">ES</option>
      </select>
    </div>
  </nav>

  <div class="p-3">
    <router-outlet></router-outlet>
  </div>
</div>
