<div class="card">
  <p-toast key="errorHandler"></p-toast>

  <ng-container *ngIf="user$ | async as user; else language_template_container">
    <nav class="navbar navbar-expand-lg navbar-dark">
      <p-tabMenu
        class="mt-3"
        [model]="items"
        [activeItem]="activeItem"
        (activeItemChange)="onActiveItemChange($event)"
      ></p-tabMenu>

      <div class="flex-grow-1"></div>
      <app-user-avatar class="mt-2" [user]="user"></app-user-avatar>

      <ng-container class="d-inline" *ngTemplateOutlet="language_template"></ng-container>
    </nav>
  </ng-container>

  <div class="p-3">
    <router-outlet></router-outlet>
  </div>
</div>

<ng-template #language_template_container>
  <div class="d-flex justify-content-end">
    <ng-container *ngTemplateOutlet="language_template"></ng-container>
  </div>
</ng-template>

<ng-template #language_template>
  <div class="input-group w-auto p-2">
    <div class="input-group-prepend">
      <label class="input-group-text" for="inputLanguageSelector">{{ "general.language" | translate }}</label>
    </div>
    <select class="form-control text-primary" (change)="changeLanguage($event.target.value)">
      <option [value]="'en'" [selected]="currentLanguage === 'en'">EN</option>
      <option [value]="'es'" [selected]="currentLanguage === 'es'">ES</option>
      <option [value]="'eu'" [selected]="currentLanguage === 'eu'">EU</option>
    </select>
  </div>
</ng-template>
