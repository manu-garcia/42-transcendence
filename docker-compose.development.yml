version: '3'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - 4200:4200
    volumes:
      # Bidireccional volume between host and container.
      - ./frontend/app:/usr/src/app
      # Binds the directory from the container to an anonymous volume. No map into the host.
      - /usr/src/app/node_modules
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      # Bidireccional volume between host and container.
      - ./backend/app:/usr/src/app
      # Binds the directory from the container to an anonymous volume. No map into the host.
      - /usr/src/app/node_modules
  pgadmin:
    build:
      context: ./pgadmin
      dockerfile: Dockerfile
      args:
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_DB=${POSTGRES_DB}
        - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
        - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - 3333:80
    networks:
      - frontend
      - backend
    depends_on:
      - db
    volumes:
        - pgadmin:/var/lib/pgadmin
  db:
    networks:
      - frontend
      - backend

volumes:
    pgadmin: