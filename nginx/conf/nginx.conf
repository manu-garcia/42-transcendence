server {
    listen      443 ssl;
    server_name  transcendence.42.fr www.transcendence.42.fr;
    ssl_certificate     /etc/nginx/ssl/transcendence.42.fr.crt;
    ssl_certificate_key /etc/nginx/ssl/transcendence.42.fr.key;
    ssl_protocols       TLSv1.3;
    include mime.types;

    location /api {

        # proxy_set_header: passes HTTP headers to the backend server

        # Upgrade $http_upgrade: This line sets the Upgrade header with the value of the incoming request's Upgrade header. This is typically used for enabling WebSocket connections.
        proxy_set_header Upgrade $http_upgrade;
        # Connection "upgrade": This line sets the Connection header to "upgrade". It indicates that the connection between the client and the backend server should be upgraded for WebSocket connections.
        proxy_set_header Connection "upgrade";
        # Host $host: This line sets the Host header to the value of the $host variable, which represents the hostname of the incoming request.
        proxy_set_header Host $host;
        # X-Real-IP $remote_addr: This line sets the X-Real-IP header to the IP address of the client making the request. This is useful for logging or identifying the original client IP in the backend server.
        proxy_set_header X-Real-IP $remote_addr;

        # Bypass the request to the backend server
        proxy_pass http://backend:3000;
    }

    location /media {

        # proxy_set_header: passes HTTP headers to the backend server

        # Upgrade $http_upgrade: This line sets the Upgrade header with the value of the incoming request's Upgrade header. This is typically used for enabling WebSocket connections.
        proxy_set_header Upgrade $http_upgrade;
        # Connection "upgrade": This line sets the Connection header to "upgrade". It indicates that the connection between the client and the backend server should be upgraded for WebSocket connections.
        proxy_set_header Connection "upgrade";
        # Host $host: This line sets the Host header to the value of the $host variable, which represents the hostname of the incoming request.
        proxy_set_header Host $host;
        # X-Real-IP $remote_addr: This line sets the X-Real-IP header to the IP address of the client making the request. This is useful for logging or identifying the original client IP in the backend server.
        proxy_set_header X-Real-IP $remote_addr;

        # Bypass the request to the backend server
        proxy_pass http://backend:3000;
    }

    location / {
        # proxy_set_header: passes HTTP headers to the backend server

        # Upgrade $http_upgrade: This line sets the Upgrade header with the value of the incoming request's Upgrade header. This is typically used for enabling WebSocket connections.
        proxy_set_header Upgrade $http_upgrade;
        # Connection "upgrade": This line sets the Connection header to "upgrade". It indicates that the connection between the client and the backend server should be upgraded for WebSocket connections.
        proxy_set_header Connection "upgrade";
        # Host $host: This line sets the Host header to the value of the $host variable, which represents the hostname of the incoming request.
        proxy_set_header Host $host;
        # X-Real-IP $remote_addr: This line sets the X-Real-IP header to the IP address of the client making the request. This is useful for logging or identifying the original client IP in the backend server.
        proxy_set_header X-Real-IP $remote_addr;

        # Bypass the request to the frontend server
        proxy_pass http://frontend:80;
    }
}
